<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zombie Defense – Defiende tu barrio</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="screen-start" class="screen">
      <div class="card">
        <h1>🧟 Zombie Defense</h1>
        <p>Defiende tu barrio de la horda.</p>
        <p class="small">Elegí una manzana en el mapa y defendela.</p>
        <button id="btn-start" class="btn primary">Comenzar</button>
        <p id="geo-error" class="error hidden"></p>
      </div>
    </div>

    <div id="screen-game" class="screen hidden">
      <div id="map"></div>
      <div id="crosshair" class="hidden"></div>

      <div id="select-overlay">
        <div id="select-hint">
          Mové el mapa y tocá <strong>Jugar en esta manzana</strong>
        </div>
        <button id="btn-confirm-area" class="btn primary">
          Jugar en esta manzana
        </button>
      </div>

      <div id="hud" class="hidden">
        <div class="hud-item">
          <span class="label">Oro</span>
          <span id="gold">0</span>
        </div>
        <div class="hud-item">
          <span class="label">Oleada</span>
          <span id="wave">0</span>
        </div>
        <div class="hud-item">
          <span class="label">Vivos</span>
          <span id="zombies-alive">0</span>
        </div>
      </div>

      <div id="controls" class="hidden">
        <button id="btn-place-defender" class="btn tool active" data-tool="defender">
          👤 Defensor<br><small>50 oro</small>
        </button>
        <button id="btn-place-barricade" class="btn tool" data-tool="barricade">
          🚧 Barricada<br><small>80 oro</small>
        </button>
        <button id="btn-next-wave" class="btn primary">
          Siguiente oleada
        </button>
      </div>

      <div id="toast" class="hidden"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
